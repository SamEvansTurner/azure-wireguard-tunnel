---
# Caddy Role - Handlers
#
# Handlers are conditional based on caddy_certs_present fact set by tasks.
# This prevents restart failures when certificates don't exist yet.
#
# Note: reload is not used because the Caddyfile has 'admin off',
# which disables the admin API that 'caddy reload' depends on.

- name: restart caddy
  systemd:
    name: caddy
    state: restarted
    enabled: yes
    daemon_reload: yes
  when: caddy_certs_present | default(false)
